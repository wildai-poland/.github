<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark obsidian gradient background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>

    <!-- Chrome / Monochromatic metallic gradients like xAI / Grok -->
    <linearGradient id="chromeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="chromeMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="chromeDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="slashGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- The Slashed Geometric 'W' (Grok / xAI Dimensional Prisms) -->
  <g transform="translate(256, 256)" filter="url(#subtleGlow)">
    <!-- Primary Left Slash (Top Bevel) -->
    <path d="M -160,-110 L -105,-110 L -30,85 L -75,85 Z" fill="url(#chromeLight)" />
    
    <!-- Primary Left Slash (Side Bevel for 3D extrusion) -->
    <path d="M -75,85 L -30,85 L -45,120 L -90,120 Z" fill="url(#chromeDark)" />

    <!-- Left Center Inner Slash -->
    <path d="M -60,-40 L -20,-40 L 40,110 L 0,110 Z" fill="url(#chromeMid)" />

    <!-- Center Bridge (Geometric Slash Cut) -->
    <path d="M -15,-110 L 30,-110 L 95,50 L 50,50 Z" fill="url(#chromeLight)" />
    
    <!-- Right Center Side Bevel -->
    <path d="M 50,50 L 95,50 L 80,85 L 35,85 Z" fill="url(#chromeDark)" />

    <!-- Right Outer Slash (Mirroring sharp angle) -->
    <path d="M 60,-40 L 105,-40 L 175,120 L 130,120 Z" fill="url(#chromeMid)" />

    <!-- Angular Grok-style Slash Cutlines (Negative space sharp accents) -->
    <polygon points="-120,-110 -105,-110 -30,85 -45,85" fill="#FFFFFF" opacity="0.6" />
    <polygon points="10,-110 25,-110 95,50 80,50" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
